# Left half - split peripheral. Hosts the PMW3610 trackball.

# Some PMW3610 boards need longer than the driver's 10ms default for their
# power rail to settle; without this the sensor can fail init and stay dead.
CONFIG_PMW3610_INIT_POWER_UP_EXTRA_DELAY_MS=300

# --- Trackball diagnostics -------------------------------------------------
# Enabled so the first flash tells us whether the trackball problem is
# hardware or software. Plug THIS half into USB, open the CDC ACM serial port
# and reset the board; the driver validates the sensor's product ID on init.
#
#   * SPI / product-ID error   -> wiring or dead sensor (check CS, IRQ, SCK,
#                                 SDIO, 3V3, GND)
#   * init OK, no motion events -> sensor alive; lens, surface or IRQ line
#   * motion events but no cursor -> software, and the log shows where it stops
#
# Comment both lines out once the trackball works - USB logging costs power
# and flash.
CONFIG_ZMK_USB_LOGGING=y
CONFIG_PMW3610_LOG_LEVEL_DBG=y
