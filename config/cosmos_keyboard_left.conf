# Left half - split peripheral. Hosts the PMW3610 trackball.

# Power-rail settle time on top of the driver's 10ms default. Generous because
# the driver's async init has no retry: on any error pmw3610_async_init logs the
# failing step and stops, so `ready` stays false and the motion IRQ is never
# enabled at all - the sensor is dead until reboot. Cold power-on is the case
# that trips it; a warm reset finds the sensor already powered and configured.
CONFIG_PMW3610_INIT_POWER_UP_EXTRA_DELAY_MS=1500

# Replaces the removed `force-awake` property (see the left overlay). Downshift
# times are divided by a granularity, so they are not wall-clock: RUN is
# reg*8*run-rate at an 8ms run-rate, so 3264 buys 6.5s; REST1_DOWNSHIFT
# granularity is 16*REST1_SAMPLE, so 40800 is 40.8s; REST2_DOWNSHIFT is
# 128*REST2_SAMPLE, and 652800 is that register's max.
# Net: RUN 6.5s -> REST1 @10ms 40.8s -> REST2 @20ms ~10.9min -> REST3 @40ms.
# REST3 is terminal - no downshift register - so its sample time is the wake
# latency after ~11.5min idle. 40 also buys headroom against the sensor's 12-bit
# delta registers, which wrap past 2047 counts in one sample period and read as
# inverted: at the current 1200 CPI that is 17in/s of ball at the old 100ms,
# 43in/s at 40. Logged raw deltas stay under 100, so that is margin and not a
# fix. Sample time range is [10, 2550].
# Out-of-range values are rejected with -EINVAL, which aborts init and leaves
# the sensor dead until reboot. Recompute a downshift if its sample time changes.
CONFIG_PMW3610_RUN_DOWNSHIFT_TIME_MS=3264
CONFIG_PMW3610_REST1_SAMPLE_TIME_MS=10
CONFIG_PMW3610_REST1_DOWNSHIFT_TIME_MS=40800
CONFIG_PMW3610_REST2_SAMPLE_TIME_MS=20
CONFIG_PMW3610_REST2_DOWNSHIFT_TIME_MS=652800
CONFIG_PMW3610_REST3_SAMPLE_TIME_MS=40

# Defaults to y; issues SPI writes from inside the motion report path. Off, the
# driver is read-only over SPI after init, so a stuck register page cannot be
# hit by a stray write. Its coverage benefit targets granite and tile.
CONFIG_PMW3610_SMART_ALGORITHM=n

# Must be 0 or at least 2x the 8ms run rate - never between. The driver purges
# its accumulator whenever the gap since the previous sample reaches this, so at
# 8 the purge fires every sample and every sample held back by the report gate
# is discarded unsent. That is the steppy-under-continuous-motion fault, and the
# reason CPI kept climbing to compensate.
# 0 reports every sample, 125/s - the rate 8 was meant to give, losing nothing.
# 16 accumulates correctly but caps updates at 62/s, below display refresh.
CONFIG_PMW3610_REPORT_INTERVAL_MIN=0

# The input thread (trackball -> BLE notify) defaults to priority 0 and outranks
# the split position-notify work queue at 5, while both pend K_FOREVER on a
# 3-buffer TX pool, so ball motion delays key events. 6 inverts that.
CONFIG_INPUT_THREAD_PRIORITY=6

# Matches the central. The driver posts motion with input_report(K_NO_WAIT) and
# discards the return, so a full queue drops the event silently - and losing the
# one event carrying `sync` leaves the listener's int16 accumulator unflushed
# until the next one, which is a candidate for the axes-go-wrong-under-load
# fault. 12 bytes per message, so this costs ~576 bytes. Deeper only helps a
# burst; against sustained overproduction it buys latency, not headroom.
CONFIG_INPUT_QUEUE_MAX_MSGS=64

# To debug the trackball, do NOT add CONFIG_ZMK_USB_LOGGING or
# CONFIG_PMW3610_LOG_LEVEL_DBG here - they need a cdc-acm node and a
# zephyr,console entry, so as bare Kconfig the build aborts. Uncomment the
# cosmos_keyboard_left_trackball_debug target in build.yaml instead.
