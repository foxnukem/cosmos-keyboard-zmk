# Left half - split peripheral. Hosts the PMW3610 trackball.

# Some PMW3610 boards need longer than the driver's 10ms default for their
# power rail to settle; without this the sensor can fail init and stay dead.
CONFIG_PMW3610_INIT_POWER_UP_EXTRA_DELAY_MS=300

# To debug the trackball again, do NOT add CONFIG_ZMK_USB_LOGGING here: it
# selects UART_CONSOLE/USB_UART_CONSOLE, which need a devicetree overlay
# supplying a cdc-acm node and a zephyr,console chosen entry, so as a bare
# Kconfig it fails with "Aborting due to Kconfig warnings". CONFIG_PMW3610_
# LOG_LEVEL_DBG depends on LOG for the same reason. Add a build.yaml target
# using ZMK's zmk-usb-logging snippet instead:
#
#   - board: nice_nano_v2
#     shield: cosmos_keyboard_left
#     snippet: zmk-usb-logging
#     cmake-args: -DCONFIG_PMW3610_LOG_LEVEL_DBG=y
#     artifact-name: cosmos_keyboard_left_trackball_debug
