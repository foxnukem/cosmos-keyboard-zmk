# Left half - split peripheral. Hosts the PMW3610 trackball.

# Some PMW3610 boards need longer than the driver's 10ms default for their
# power rail to settle; without this the sensor can fail init and stay dead.
CONFIG_PMW3610_INIT_POWER_UP_EXTRA_DELAY_MS=300

# Trackball diagnostics are deliberately NOT enabled here.
# CONFIG_ZMK_USB_LOGGING selects UART_CONSOLE/USB_UART_CONSOLE, which need a
# devicetree overlay supplying a cdc-acm node and a zephyr,console chosen
# entry. As a bare Kconfig it fails with "Aborting due to Kconfig warnings",
# and CONFIG_PMW3610_LOG_LEVEL_DBG depends on LOG for the same reason.
# Use the cosmos_keyboard_left_trackball_debug target in build.yaml, which
# applies ZMK's zmk-usb-logging snippet and supplies that overlay.
