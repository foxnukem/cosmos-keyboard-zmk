# Left half - split peripheral. Hosts the PMW3610 trackball.

# Power-rail settle time on top of the driver's 10ms default. Generous because
# the driver's async init has no retry - one failed step leaves the sensor dead
# until reboot.
CONFIG_PMW3610_INIT_POWER_UP_EXTRA_DELAY_MS=500

# Replaces the removed `force-awake` property (see the left overlay): RUN for
# 3.3s, then REST1 polling at 10ms for ~11min, then the REST2/REST3 defaults.
# Out-of-range values are rejected with -EINVAL, which aborts init and leaves
# the sensor dead until reboot. Limits: RUN_DOWNSHIFT max 3264 (Kconfig);
# REST1_SAMPLE min 10; REST1_DOWNSHIFT is 16*REST1_SAMPLE .. 255*16*REST1_SAMPLE,
# so it moves if you change the sample time - recompute both together.
CONFIG_PMW3610_RUN_DOWNSHIFT_TIME_MS=3264
CONFIG_PMW3610_REST1_SAMPLE_TIME_MS=10
CONFIG_PMW3610_REST1_DOWNSHIFT_TIME_MS=40800

# Defaults to y; issues SPI writes from inside the motion report path. Off, the
# driver is read-only over SPI after init, so a stuck register page cannot be
# hit by a stray write. Its coverage benefit targets granite and tile.
CONFIG_PMW3610_SMART_ALGORITHM=n

# To debug the trackball, do NOT add CONFIG_ZMK_USB_LOGGING or
# CONFIG_PMW3610_LOG_LEVEL_DBG here - they need a cdc-acm node and a
# zephyr,console entry, so as bare Kconfig the build aborts. Use a build.yaml
# target with ZMK's zmk-usb-logging snippet instead:
#
#   - board: nice_nano_v2
#     shield: cosmos_keyboard_left
#     snippet: zmk-usb-logging
#     cmake-args: -DCONFIG_PMW3610_LOG_LEVEL_DBG=y
#     artifact-name: cosmos_keyboard_left_trackball_debug
