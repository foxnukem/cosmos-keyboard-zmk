# User Configuration - applies to BOTH halves.
# Per-half settings live in cosmos_keyboard_left.conf / cosmos_keyboard_right.conf.
# All driver Kconfig is in Kconfig.defconfig

CONFIG_EC11=y
CONFIG_EC11_TRIGGER_GLOBAL_THREAD=y

# Local key events go through a 4-deep queue (ZMK default) pushed with K_NO_WAIT
# and no error check, drained on the system workqueue - the same queue the temp
# layer blocks for 10ms per activation and per deactivation. An overflow drops a
# release for good, since debounce state has already moved past it. Both halves:
# the left's system workqueue also runs the trackball's SPI burst reads.
CONFIG_ZMK_KSCAN_EVENT_QUEUE_SIZE=64
