# Right half - split central. Hosts the OLED.

# ZMK's built-in status screen layout plus the left half's battery level.
# Implemented in src/custom_status_screen.c.
CONFIG_ZMK_DISPLAY_STATUS_SCREEN_CUSTOM=y

# The built-in status screen `imply`s these; a custom one must ask for them.
CONFIG_ZMK_WIDGET_BATTERY_STATUS=y
CONFIG_ZMK_WIDGET_BATTERY_STATUS_SHOW_PERCENTAGE=y
CONFIG_ZMK_WIDGET_OUTPUT_STATUS=y
CONFIG_ZMK_WIDGET_LAYER_STATUS=y
CONFIG_ZMK_BATTERY_REPORTING=y
CONFIG_LV_USE_LABEL=y

# Fonts and LVGL sizing, likewise only defaulted for the built-in screen.
# 14, not the stock 16: its 16px line height tiles two rows exactly into the
# 32px panel. At 16 the rows overlap and only survive because digits and '%'
# have no descenders.
CONFIG_LV_FONT_MONTSERRAT_14=y
CONFIG_LV_FONT_DEFAULT_MONTSERRAT_14=y
CONFIG_LV_USE_THEME_MONO=y
CONFIG_LV_Z_MEM_POOL_SIZE=4096

# Key-position and trackball events share one 5-deep queue here (ZMK default),
# pushed with K_NO_WAIT and no error check. An overflow loses a key release for
# good, because position_state is committed before the enqueue and the next
# notification XORs to zero - that is the stuck repeating key.
CONFIG_ZMK_SPLIT_BLE_CENTRAL_POSITION_QUEUE_SIZE=40
CONFIG_INPUT_QUEUE_MAX_MSGS=64

# ZMK bumps this to 1024 only for peripherals, so the central keeps Zephyr's 512
# while running transform -> scaler -> temp_layer -> HID send on it. Upstream
# measured ~840 bytes used on that path (zmk#3212, central locks up).
CONFIG_INPUT_THREAD_STACK_SIZE=2048
