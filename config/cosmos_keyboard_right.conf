# Right half - split central. Hosts the OLED.

# Two-line status screen: <bt profile> <right batt> <left batt> / <layer name>.
# Implemented in src/custom_status_screen.c.
#
# Currently DISABLED as a bisect: with this off the half runs ZMK's built-in
# status screen, which is the same code a Corne runs on this same panel.
#   * built-in also garbled -> bus/wiring/panel, not the screen code
#   * built-in clean        -> the fault is in src/custom_status_screen.c
# Re-enable by uncommenting.
#CONFIG_ZMK_DISPLAY_STATUS_SCREEN_CUSTOM=y

# LVGL rendering runs as work submitted every 10ms by display_timer. By
# default that lands on the system work queue, shared here with the split BLE
# central and the trackball's input events - neither of which a Corne central
# has to deal with. If that queue stalls, lv_task_handler() never runs, so the
# panel stays showing its uninitialised power-up RAM even though init
# succeeded and display_blanking_off() lit it. Give the display its own queue.
CONFIG_ZMK_DISPLAY_WORK_QUEUE_DEDICATED=y

# The built-in status screen `imply`s these; a custom one must ask for them.
# The battery line is our own widget, so ZMK_WIDGET_BATTERY_STATUS stays off.
CONFIG_ZMK_WIDGET_OUTPUT_STATUS=y
CONFIG_ZMK_WIDGET_LAYER_STATUS=y
CONFIG_ZMK_BATTERY_REPORTING=y
CONFIG_LV_USE_LABEL=y

# Fonts and LVGL sizing, likewise only defaulted for the built-in screen.
# Montserrat 12 (the small font) comes from ZMK_LV_FONT_DEFAULT_SMALL.
CONFIG_LV_FONT_MONTSERRAT_16=y
CONFIG_LV_FONT_DEFAULT_MONTSERRAT_16=y
CONFIG_LV_USE_THEME_MONO=y
CONFIG_LV_Z_MEM_POOL_SIZE=4096
