# This file generates the GitHub Actions matrix.
# For simple board + shield combinations, add them to the top level board and
# shield arrays, for more control, add individual board + shield combinations
# to the `include` property. You can also use the `cmake-args` property to
# pass flags to the build command, `snippet` to add a Zephyr snippet, and
# `artifact-name` to assign a name to distinguish build outputs from each other:
#
# board: [ "nice_nano_v2" ]
# shield: [ "corne_left", "corne_right" ]
# include:
#   - board: bdn9_rev2
#   - board: nice_nano_v2
#     shield: reviung41
#   - board: nice_nano_v2
#     shield: corne_left
#     snippet: studio-rpc-usb-uart
#     cmake-args: -DCONFIG_ZMK_STUDIO=y
#     artifact-name: corne_left_with_studio
#
---
include:

  - board: nice_nano_v2
    shield: cosmos_keyboard_left

## Trackball diagnostics. Flash this instead of the normal left firmware, plug
## the LEFT half into USB and open its CDC ACM serial port, then reset.
## The PMW3610 driver validates the sensor's product ID during init:
##   * SPI / product-ID error       -> wiring or dead sensor (CS, IRQ, SCK,
##                                     SDIO, 3V3, GND)
##   * init OK, no motion events    -> sensor alive; lens, surface or IRQ line
##   * motion events but no cursor  -> software; the log shows where it stops
  - board: nice_nano_v2
    shield: cosmos_keyboard_left
    snippet: zmk-usb-logging
    cmake-args: -DCONFIG_PMW3610_LOG_LEVEL_DBG=y
    artifact-name: cosmos_keyboard_left_trackball_debug

## To build with ZMK Studio support, uncomment the following block
## by removing the leading '#' from each line.

#  - board: nice_nano_v2
#    shield: cosmos_keyboard_left
#    snippet: studio-rpc-usb-uart
#    cmake-args: -DCONFIG_ZMK_STUDIO=y
#    artifact-name: cosmos_keyboard_left_with_studio

  - board: nice_nano_v2
    shield: cosmos_keyboard_right

  - board: nice_nano_v2
    shield: settings_reset
